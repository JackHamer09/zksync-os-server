# Standalone workspace root: keep this demo out of the server's cargo workspace so it
# resolves its own deps independently (mirrors the self-contained node project it replaces).
[workspace]

[package]
name = "atomic-swap-demo"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone demo binary (not a member of the server workspace) so it stays
# self-contained, mirroring the former ts-node project it replaces.
[[bin]]
name = "atomic-swap"
path = "src/main.rs"

[dependencies]
# `json` enables reading the vendored artifact ABIs in `sol!(Name, "abis/Name.json")`.
alloy = { version = "2.0.5", features = [
    "providers",
    "transport-http",
    "reqwest",
    "signer-local",
    "network",
    "sol-types",
    "json",
] }
anyhow = "1.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
